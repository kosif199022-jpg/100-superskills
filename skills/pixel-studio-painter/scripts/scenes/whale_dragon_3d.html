<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>الحوت والتنين (3D)</title>
<!--
  A real 3D version of the whale-versus-dragon shot, in the HyperFrames way: an HTML page that renders one
  deterministic frame (and can be seeked with window.render(t)). Physically based materials, two key lights,
  fog, rain, embers and bloom. KOSIF Studio renders it in headless Edge, draws it pixel by pixel and can write
  the Python program that reproduces the frame.
  Contract: window.__ready = true when the frame is drawn; window.render(t) seeks; window.__duration in seconds.
-->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const noise = new ImprovedNoise();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a10);
scene.fog = new THREE.FogExp2(0x101a26, 0.016);

// camera: low, beside the whale, looking up at the dragon
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);
camera.position.set(8, 3.0, 36);
camera.lookAt(-2, 6.0, 0);

// lights: cold lightning behind the clouds (key), warm fire (point), dim sky
const cold = new THREE.DirectionalLight(0xcfe0ff, 4.2);
cold.position.set(14, 24, -18); cold.castShadow = true;
cold.shadow.mapSize.set(2048, 2048); cold.shadow.camera.left = -30; cold.shadow.camera.right = 30;
cold.shadow.camera.top = 30; cold.shadow.camera.bottom = -30; cold.shadow.bias = -0.0005;
scene.add(cold);
const fire = new THREE.PointLight(0xff8a3a, 420, 60, 1.6);
fire.position.set(-1.5, 7.6, 3);
fire.castShadow = true;
scene.add(fire);
scene.add(new THREE.HemisphereLight(0x4a5e80, 0x070a10, 1.1));

// ── the sea: a displaced plane with a wet, reflective physical material ─────────────────────────────────
const seaGeo = new THREE.PlaneGeometry(260, 260, 360, 360);
const sp = seaGeo.attributes.position;
for (let i = 0; i < sp.count; i++) {
  const x = sp.getX(i), y = sp.getY(i);
  let h = 0, a = 1.1, f = 0.11;
  for (let o = 0; o < 4; o++) { h += noise.noise(x * f + 3.1, y * f + 7.7, o * 2.3) * a; a *= 0.5; f *= 2.1; }
  h += Math.sin(x * 0.35 + y * 0.12) * 0.35;
  sp.setZ(i, h);
}
seaGeo.computeVertexNormals();
const sea = new THREE.Mesh(seaGeo, new THREE.MeshPhysicalMaterial({
  color: 0x1a2a3a, roughness: 0.22, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.12,
  envMapIntensity: 0.6, specularIntensity: 1.2, specularColor: new THREE.Color(0x9fb6d8) }));
sea.rotation.x = -Math.PI / 2; sea.position.y = -1.2; sea.receiveShadow = true;
scene.add(sea);

// ── the whale: a humpback profile lathed into a body, knobbed skin, white belly, wet clearcoat ───────────
const profile = [[0,0],[0.25,0.9],[0.6,1.5],[1.1,1.95],[1.7,2.25],[2.4,2.4],[3.3,2.35],[4.3,2.05],[5.3,1.55],[6.1,1.05],[6.8,0.6],[7.2,0.25],[7.4,0]]
  .map(([x, r]) => new THREE.Vector2(r, x - 3.7));
const whaleGeo = new THREE.LatheGeometry(profile, 160);
const wp = whaleGeo.attributes.position; const colors = [];
const col = new THREE.Color();
for (let i = 0; i < wp.count; i++) {
  const x = wp.getX(i), y = wp.getY(i), z = wp.getZ(i);
  const r = Math.hypot(x, z) || 1;
  const bump = noise.noise(x * 2.1, y * 2.1, z * 2.1) * 0.06 + noise.noise(x * 7, y * 7, z * 7) * 0.02;
  // flatten the belly side (+z toward camera) and add throat pleats as fine ridges
  const belly = Math.max(0, z / r);
  const pleat = belly > 0.3 && y < 1.5 ? Math.sin(Math.atan2(x, z) * 26) * 0.012 * belly : 0;
  const s = 1 + bump + pleat - belly * 0.08;
  wp.setXYZ(i, x * s, y, z * s);
  // dark back, lighter belly
  const t = THREE.MathUtils.clamp(belly * 1.3 - 0.1, 0, 1);
  col.setHex(0x3a4650).lerp(new THREE.Color(0xd6dde3), t * t);
  colors.push(col.r, col.g, col.b);
}
whaleGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
whaleGeo.computeVertexNormals();
const whaleMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.32, metalness: 0,
  clearcoat: 0.9, clearcoatRoughness: 0.22, sheen: 0.3, sheenColor: new THREE.Color(0x9fb6d8) });
const whale = new THREE.Group();
const body = new THREE.Mesh(whaleGeo, whaleMat); body.castShadow = body.receiveShadow = true;
whale.add(body);
// pectoral fin: a long tapered shape, white underside
const finShape = new THREE.Shape();
finShape.moveTo(0, 0); finShape.quadraticCurveTo(1.2, -0.3, 3.6, -1.1); finShape.quadraticCurveTo(2.2, 0.2, 0.3, 0.55); finShape.lineTo(0, 0);
const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.16, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.06, bevelSegments: 3 });
const fin = new THREE.Mesh(finGeo, new THREE.MeshPhysicalMaterial({ color: 0xe8eef2, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.2 }));
fin.position.set(0.9, -0.2, 1.9); fin.rotation.set(0.5, 0.3, -0.9); fin.scale.set(1.5, 1.5, 1); fin.castShadow = true;
whale.add(fin);
// flukes
const flukeShape = new THREE.Shape();
flukeShape.moveTo(0, 0); flukeShape.quadraticCurveTo(1.8, 0.4, 2.8, 1.4); flukeShape.quadraticCurveTo(2.2, 0.3, 2.0, -0.1);
flukeShape.quadraticCurveTo(2.2, -0.5, 2.8, -1.4); flukeShape.quadraticCurveTo(1.8, -0.4, 0, 0);
const fluke = new THREE.Mesh(new THREE.ExtrudeGeometry(flukeShape, { depth: 0.12, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.04 }), whaleMat);
fluke.position.set(0, -3.9, 0); fluke.rotation.set(Math.PI / 2, 0, Math.PI / 2 + 0.2); fluke.scale.set(1.3, 1.3, 1); fluke.castShadow = true;
whale.add(fluke);
// eye
const eye = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 24), new THREE.MeshPhysicalMaterial({ color: 0x05070a, roughness: 0.1, clearcoat: 1 }));
eye.position.set(1.2, 2.9, 1.75); whale.add(eye);
whale.position.set(4.5, 3.0, 2.5);
whale.rotation.set(0.35, -0.55, -0.85);
scene.add(whale);

// ── the dragon: body along a curve, bat wings, horns, lit by its own fire ───────────────────────────────
const dragon = new THREE.Group();
const spine = new THREE.CatmullRomCurve3([new THREE.Vector3(-16, 14.5, -12), new THREE.Vector3(-12.5, 12.6, -8), new THREE.Vector3(-9, 10.8, -4.5),
  new THREE.Vector3(-6, 9.4, -1.5), new THREE.Vector3(-3.6, 8.4, 1.0), new THREE.Vector3(-1.8, 7.7, 2.6)]);
const bodyGeo = new THREE.TubeGeometry(spine, 120, 1.0, 24, false);
const bp = bodyGeo.attributes.position;
for (let i = 0; i < bp.count; i++) {            // taper toward the head and the tail, scales as bumps
  const u = (i % 25) / 24; const seg = Math.floor(i / 25) / 120;
  const taper = 0.55 + 0.75 * Math.sin(Math.PI * Math.min(1, seg * 1.15));
  const p = new THREE.Vector3(bp.getX(i), bp.getY(i), bp.getZ(i));
  const c = spine.getPointAt(Math.min(1, seg));
  const d = p.clone().sub(c);
  const b = 1 + noise.noise(p.x * 3, p.y * 3, p.z * 3) * 0.08 + noise.noise(p.x * 11, p.y * 11, p.z * 11) * 0.03;
  d.multiplyScalar(taper * b);
  bp.setXYZ(i, c.x + d.x, c.y + d.y, c.z + d.z);
}
bodyGeo.computeVertexNormals();
const hide = new THREE.MeshPhysicalMaterial({ color: 0x2a1a12, roughness: 0.55, metalness: 0.05, clearcoat: 0.4, clearcoatRoughness: 0.4,
  sheen: 0.4, sheenColor: new THREE.Color(0xff8a3a) });
const dbody = new THREE.Mesh(bodyGeo, hide); dbody.castShadow = true; dragon.add(dbody);
// head: an elongated skull with jaws
const head = new THREE.Mesh(new THREE.SphereGeometry(1.0, 48, 32), hide);
head.scale.set(2.1, 0.9, 1.1); head.position.set(-0.6, 7.4, 3.4); head.rotation.set(0.15, 0.4, -0.25); head.castShadow = true; dragon.add(head);
const jaw = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.2, 24), hide);
jaw.position.set(0.5, 6.7, 3.9); jaw.rotation.set(0.2, 0.4, -1.9); dragon.add(jaw);
for (const [sx, sy, sz, rz] of [[-1.5, 8.0, 3.2, 0.8], [-1.3, 8.2, 3.7, 0.5], [-1.9, 7.9, 2.9, 1.0]]) {
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.16, 1.6, 12), new THREE.MeshPhysicalMaterial({ color: 0x1a1416, roughness: 0.35, clearcoat: 0.6 }));
  horn.position.set(sx, sy, sz); horn.rotation.set(0.3, 0, rz); dragon.add(horn);
}
const eyeD = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffcf4a }));
eyeD.position.set(-0.1, 7.7, 4.15); dragon.add(eyeD);
// wings: thin membranes between finger bones, slightly translucent to the fire
function wing(side) {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(2.5, 5.5); shape.lineTo(9, 7.5); shape.quadraticCurveTo(8, 4.5, 11, 2.5);
  shape.quadraticCurveTo(8.5, 1.5, 9, -1.5); shape.quadraticCurveTo(6, 0, 4, -1.8); shape.lineTo(0, 0);
  const mem = new THREE.Mesh(new THREE.ShapeGeometry(shape, 12), new THREE.MeshPhysicalMaterial({ color: 0x1c2230, roughness: 0.7,
    side: THREE.DoubleSide, transmission: 0.12, thickness: 0.3, sheen: 0.25, sheenColor: new THREE.Color(0x9fb6d8) }));
  mem.castShadow = true; g.add(mem);
  for (const [x, y] of [[2.5, 5.5], [9, 7.5], [11, 2.5], [9, -1.5]]) {
    const len = Math.hypot(x, y);
    const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.14, len, 10), new THREE.MeshPhysicalMaterial({ color: 0x14181f, roughness: 0.5 }));
    bone.position.set(x / 2, y / 2, 0.02); bone.rotation.z = Math.atan2(y, x) - Math.PI / 2; g.add(bone);
  }
  g.position.set(-9, 11.2, -4); g.rotation.set(0.9 * side, -0.4, 0.5 * side); g.scale.set(0.9, side * 0.9, 1);
  return g;
}
dragon.add(wing(1)); dragon.add(wing(-1));
scene.add(dragon);

// ── the fire: additive sprites along the breath, and embers ────────────────────────────────────────────
function discTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,220,160,0.8)'); r.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const disc = discTexture();
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const fireFrom = new THREE.Vector3(0.9, 6.6, 4.2), fireTo = new THREE.Vector3(2.4, 5.4, 4.6);
function particles(n, size, color, from, to, spread, lift) {
  const pos = [];
  for (let i = 0; i < n; i++) {
    const t = rnd(); const p = from.clone().lerp(to, t);
    pos.push(p.x + (rnd() - .5) * spread * (0.3 + t), p.y + (rnd() - .5) * spread * (0.3 + t) + rnd() * lift, p.z + (rnd() - .5) * spread * 0.6);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, map: disc, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true }));
}
scene.add(particles(900, 0.9, 0xff4a12, fireFrom, fireTo, 1.4, 0.4));
scene.add(particles(500, 0.55, 0xff9326, fireFrom, fireTo, 0.9, 0.3));
scene.add(particles(260, 0.3, 0xffe7a2, fireFrom, fireTo, 0.5, 0.2));
scene.add(particles(700, 0.14, 0xffd27a, fireFrom, new THREE.Vector3(5, 7, 5), 4.5, 3));      // embers in the wind
// rain: thin streaks
const rainPos = [];
for (let i = 0; i < 2600; i++) { const x = (rnd() - .5) * 60, y = rnd() * 30 - 2, z = (rnd() - .5) * 40 + 4; rainPos.push(x, y, z, x - 0.08, y - 0.7, z); }
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(rainPos, 3));
scene.add(new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9fb6d8, transparent: true, opacity: 0.35 })));
// steam where the fire meets the water spray
scene.add(particles(500, 1.8, 0x7a8698, fireTo, new THREE.Vector3(3.2, 6.6, 4.6), 2.2, 1.5));
// spray at the whale's foot
scene.add(particles(900, 0.22, 0xdbe8fb, new THREE.Vector3(6, -1, 4), new THREE.Vector3(9, 1.5, 6), 3, 2));

// lightning bolt
const boltPts = []; let bx = 13, by = 26, bz = -24;
while (by > 2) { boltPts.push(new THREE.Vector3(bx, by, bz)); bx += (rnd() - .55) * 1.4; by -= 1.1 + rnd(); bz += (rnd() - .5) * 0.6; }
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(boltPts), new THREE.LineBasicMaterial({ color: 0xf6f9ff })));
const boltGlow = new THREE.PointLight(0x8fb4ff, 40, 90, 1.6); boltGlow.position.set(12, 22, -26); scene.add(boltGlow);

// post: bloom + output (sRGB, tone mapped)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.5, 0.78));
composer.addPass(new OutputPass());

window.__duration = 6;
window.render = (t) => {                       // seekable: the whale rises and the dragon dives with time
  whale.position.y = 3.6 + Math.sin(t * 0.9) * 0.3;
  dragon.position.y = -t * 0.25;
  fire.intensity = 420 + Math.sin(t * 23) * 60;
  composer.render();
  window.__ready = true;
};
window.__ready = false;
requestAnimationFrame(() => window.render(0));
</script>
</body>
</html>
