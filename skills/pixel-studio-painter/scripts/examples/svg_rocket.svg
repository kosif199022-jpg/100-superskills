<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>صاروخ</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#3a2a6a"/></linearGradient>
    <radialGradient id="flame"><stop offset="0" stop-color="#fff6b0"/><stop offset=".5" stop-color="#ff9a2a"/><stop offset="1" stop-color="#ff3d0a" stop-opacity="0"/></radialGradient>
    <style>.star{fill:#fff;opacity:.8} .body{fill:#e8eef5;stroke:#5b6b80;stroke-width:2}</style>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle class="star" cx="40" cy="40" r="1.5"/><circle class="star" cx="320" cy="60" r="2"/><circle class="star" cx="250" cy="25" r="1.2"/>
  <g transform="translate(200 150) rotate(-20)">
    <ellipse cx="0" cy="70" rx="16" ry="34" fill="url(#flame)"/>
    <path class="body" d="M0 -80 C 28 -50 30 10 22 50 H -22 C -30 10 -28 -50 0 -80 Z"/>
    <circle cx="0" cy="-20" r="12" fill="#4fc3f7" stroke="#5b6b80" stroke-width="3"/>
    <path d="M-22 20 L-42 58 L-20 50 Z M22 20 L42 58 L20 50 Z" fill="#e53935"/>
  </g>
  <text x="200" y="285" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">إلى القمر</text>
</svg>
