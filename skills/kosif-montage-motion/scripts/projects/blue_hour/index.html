<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>الطريق في الساعة الزرقاء — KOSIF Motion 3D</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<script src="assets/main.bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Segoe UI", Tahoma, sans-serif; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #title, #endtitle, .label { direction: rtl; unicode-bidi: isolate; color: #fff; visibility: hidden; position: absolute; }
  #title { right: 0; left: 0; top: 12%; text-align: center; font-size: 112px; font-weight: 800; text-shadow: 0 3px 14px rgba(0,0,0,.55); }
  #endtitle { right: 0; left: 0; top: 10%; text-align: center; font-size: 80px; font-weight: 800; text-shadow: 0 3px 18px rgba(0,0,0,.7); }
  #endtitle small { display: block; direction: rtl; font-size: 30px; font-weight: 300; margin-top: 16px; opacity: .85; }
  .label { font-size: 46px; font-weight: 700; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .label small { display: block; font-size: 25px; font-weight: 300; opacity: .95; margin-top: 8px; }
  #letterbox-top, #letterbox-bottom { position: absolute; left: 0; right: 0; height: 0px; background: #000; z-index: 70; }
  #letterbox-top { top: 0; } #letterbox-bottom { bottom: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="8.0" data-fps="30">
  <audio id="ambience" src="assets/ambience.wav" data-start="0" data-duration="8.0" data-volume="0.9" data-fade-out="1"></audio>
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="shade" style="position:absolute;left:0;right:0;top:0;height:48%;opacity:0;pointer-events:none;background:linear-gradient(180deg, rgba(5,10,18,.55) 0%, rgba(5,10,18,.25) 55%, rgba(5,10,18,0) 100%)"></div>
  <div id="letterbox-top"></div><div id="letterbox-bottom"></div>
  <div id="title">الطريق في الساعة الزرقاء</div>
  <div id="endtitle">الضوء يكتب أثره<small>تعريض طويل لثانية واحدة</small></div>

  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s);
    const three = window.__three.build($("#gl"), 1920, 1080);
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    const E = M.ease, S = 8.0;
    tl.fromTo(["#letterbox-top", "#letterbox-bottom"], { height: 70 }, { height: 0, duration: 2.2, ease: E.drive }, Math.min(2.4, S * 0.15));
    tl.to("#shade", { opacity: 1, duration: 0.8 }, 0.3);
    tl.to("#shade", { opacity: 0, duration: 0.8 }, Math.min(2.8, S * 0.2));
    M.revealWords(tl, $("#title"), 0.5, { dur: 1.1, stagger: 0.12, ease: E.settle });
    M.hideWords(tl, $("#title"), Math.min(2.7, S * 0.2), { dur: 0.5 });
    M.revealWords(tl, $("#endtitle"), S - 1.4, { dur: 1.0, stagger: 0.1, ease: E.settle });

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", S);
    const seek = window.__kosifSeek;
    window.render = (t) => { window.__ready = false; seek(t); three.render(t); requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; })); };
    window.__ready = false;
    // build() may return { ready: Promise } when it loads textures, models or data first: the first frame waits for it
    Promise.all([document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(), three.ready || Promise.resolve()])
      .then(() => { seek(0); three.render(0); three.render(0); window.__ready = true; })
      .catch((e) => console.error("scene failed to load", e));
  </script>
</div>
</body>
</html>
