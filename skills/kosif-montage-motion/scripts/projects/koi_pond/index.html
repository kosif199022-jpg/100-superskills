<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>بركة الكوي — KOSIF Motion 3D</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<script src="assets/main.bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Segoe UI", Tahoma, sans-serif; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #title, #endtitle, .label { direction: rtl; unicode-bidi: isolate; color: #fff; visibility: hidden; position: absolute; }
  #title { right: 0; left: 0; top: 11%; text-align: center; font-size: 104px; font-weight: 700; letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(20,10,0,.35); }
  #title small, #endtitle small { display: block; font-size: 34px; font-weight: 400; margin-top: 14px; opacity: .92; }
  #endtitle { right: 0; left: 0; top: 40%; text-align: center; font-size: 92px; font-weight: 700; direction: ltr; text-shadow: 0 2px 18px rgba(20,10,0,.35); }
  .label { font-size: 46px; font-weight: 700; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .label small { display: block; font-size: 25px; font-weight: 300; opacity: .95; margin-top: 8px; }
  #letterbox-top, #letterbox-bottom { position: absolute; left: 0; right: 0; height: 0px; background: #000; z-index: 70; }
  #letterbox-top { top: 0; } #letterbox-bottom { bottom: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="10.0" data-fps="30">
  <!-- <audio id="ambience" src="assets/ambience.wav" data-start="0" data-duration="10.0" data-volume="0.9" data-fade-out="1"></audio> -->
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="shade" style="position:absolute;left:0;right:0;top:0;height:48%;opacity:0;pointer-events:none;background:linear-gradient(180deg, rgba(5,10,18,.55) 0%, rgba(5,10,18,.25) 55%, rgba(5,10,18,0) 100%)"></div>
  <div id="letterbox-top"></div><div id="letterbox-bottom"></div>
  <div id="endshade" style="position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse 46% 30% at 50% 48%, rgba(8,14,10,.55) 0%, rgba(8,14,10,.25) 60%, rgba(8,14,10,0) 100%)"></div>
  <div id="title">بركة الكوي<small>كل إطار برنامج</small></div>
  <div id="endtitle">KOSIF Motion<small>واقعية تُكتب بالكود</small></div>

  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s);
    $("#gl").addEventListener("webglcontextlost", () => console.error("WEBGL CONTEXT LOST")); $("#gl").addEventListener("webglcontextrestored", () => console.error("WEBGL CONTEXT RESTORED"));
    const three = window.__three.build($("#gl"), 1920, 1080);
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    const E = M.ease, S = 10.0;
    tl.fromTo(["#letterbox-top", "#letterbox-bottom"], { height: 70 }, { height: 0, duration: 2.2, ease: E.drive }, Math.min(2.4, S * 0.15));
    tl.to("#shade", { opacity: 1, duration: 0.8 }, 0.3);
    tl.to("#shade", { opacity: 0, duration: 0.8 }, Math.min(2.8, S * 0.2));
    M.revealWords(tl, $("#title"), 0.45, { dur: 0.9, stagger: 0.1, ease: M.E.out });
    M.hideWords(tl, $("#title"), 2.9, { dur: 0.45, ease: M.E.exit });
    tl.fromTo("#endshade", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: M.E.smooth, immediateRender: false }, S - 2.3);
    M.revealWords(tl, $("#endtitle"), S - 2.0, { dur: 1.0, stagger: 0.09, ease: M.E.out });

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", S);
    const seek = window.__kosifSeek;
    window.render = (t) => { window.__ready = false; seek(t); three.render(t); requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; })); };
    window.__ready = false;
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { seek(0); three.render(0); three.render(0); window.__ready = true; });
  </script>
</div>
</body>
</html>
