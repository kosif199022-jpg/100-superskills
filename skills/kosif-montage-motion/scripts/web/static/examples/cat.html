<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نزهة قطة • KOSIF Motion</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4eee5;color:#4d5444;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(1120px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin:0 4px 20px}h1{font-size:22px;margin:0;font-weight:650}header p{font-size:12px;letter-spacing:.16em;direction:ltr;color:#727e68}#stage{display:block;width:100%;height:auto;border-radius:24px;box-shadow:0 24px 80px #45583d12}footer{display:flex;align-items:center;gap:14px;margin-top:18px}button{border:1px solid #697a6040;border-radius:30px;padding:10px 24px;background:#faf8f0;color:#3e533c;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c07837;outline-offset:4px}input{flex:1;accent-color:#6d8257;direction:ltr}small{font-size:12px;color:#727e68;direction:ltr}.capture{padding:0;display:block;background:#e9eedc}.capture main{width:960px}.capture header,.capture footer{display:none}.capture #stage{border-radius:0;box-shadow:none;width:960px;height:540px}</style><body data-composition-id="cat-walk" data-width="960" data-height="540" data-duration="8" data-fps="30"><main><header><h1>نزهة قطة</h1><p>KOSIF MOTION · LITTLE MOMENTS</p></header><svg id="stage" role="img" aria-labelledby="scene-title scene-desc" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg"><title id="scene-title">قطة برتقالية تتمشى بهدوء</title><desc id="scene-desc">قطة كرتونية تمشي من اليمين إلى اليسار، تحرك ذيلها وترمش على خلفية حديقة هادئة.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e9efdf"/><stop offset="1" stop-color="#f8f3df"/></linearGradient><linearGradient id="fur" x2=".2" y2="1"><stop stop-color="#efa849"/><stop offset="1" stop-color="#dc8736"/></linearGradient><linearGradient id="face" x2=".5" y2="1"><stop stop-color="#f3b453"/><stop offset="1" stop-color="#e5953c"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="960" height="540" fill="url(#sky)"/><circle cx="745" cy="135" r="65" fill="#fff9d7" opacity=".85"/><path d="M0 313 Q180 244 390 307 T960 296V540H0Z" fill="#d8e1c5"/><path d="M0 345Q220 283 440 337T960 329V540H0Z" fill="#c8d5b4"/><path d="M0 381Q240 356 480 381T960 379V540H0Z" fill="#e9e5cd"/><path d="M0 420Q440 390 960 426" fill="none" stroke="#d8d6bd" stroke-width="2" opacity=".7"/><g stroke="#8a9b73" fill="none" stroke-width="3" stroke-linecap="round" opacity=".65"><path d="M96 366l-5-16m5 16 7-22m-7 22 14-9M851 368l-4-18m4 18 9-24m-9 24 14-8"/></g><g fill="#f8f4df"><circle cx="111" cy="346" r="4"/><circle cx="863" cy="345" r="4"/></g><g id="cats"></g><g fill="#aaa889" opacity=".45"><ellipse cx="211" cy="455" rx="4" ry="2"/><ellipse cx="755" cy="474" rx="5" ry="2"/><ellipse cx="647" cy="411" rx="3" ry="1.5"/></g></svg><footer><a href="cat.mp4" download="cat-walk.mp4" style="color:#3e533c;text-decoration:none;border:1px solid #697a6040;border-radius:30px;padding:10px 20px;font-size:14px">تنزيل MP4</a><button id="play" type="button" aria-label="إيقاف الحركة">إيقاف مؤقت</button><input id="time" aria-label="موضع الحركة" type="range" min="0" max="8" step=".01" value="0"><small id="readout">0.0 / 8.0 s</small></footer></main><script>
(()=>{const TAU=Math.PI*2, cats=document.getElementById('cats'),slider=document.getElementById('time'),button=document.getElementById('play');let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches, current=0,last=null;const n=x=>x.toFixed(3);
function leg(x,phase,far){const a=Math.sin(phase),lift=Math.max(0,Math.cos(phase))*15,foot=x+22*a, knee=x+12*a;return `<path d="M${x} 3 Q${n(knee)} 39 ${n(foot)} ${n(64-lift)} Q${n(foot-3)} ${n(74-lift)} ${n(foot-17)} ${n(72-lift)}" fill="none" stroke="${far?'#bb6c2e':'#e5963d'}" stroke-width="23" stroke-linecap="round"/><path d="M${n(foot-17)} ${n(72-lift)}h11" stroke="${far?'#e5b273':'#f9d89c'}" stroke-width="15" stroke-linecap="round"/>`;}
function cat(x,t){const p=t*TAU*1.5,bob=Math.cos(p*2)*2,tail=Math.sin(p*.5)*9,blink=Math.abs(((t-2.35+8)%4)-2)<.095;return `<g transform="translate(${n(x)} 313)"><ellipse cx="-4" cy="82" rx="119" ry="12" fill="#6c704e" opacity=".17" filter="url(#soft)"/><g transform="translate(0 ${n(bob)})"><path d="M78 -16 C135 -29 130 -103 160 -116 Q184 -125 185 -99" fill="none" stroke="#d88634" stroke-width="25" stroke-linecap="round" transform="rotate(${n(tail)} 78 -16)"/><path d="M158 -116 Q184 -125 185 -99" fill="none" stroke="#f7cf8a" stroke-width="25" stroke-linecap="round" transform="rotate(${n(tail)} 78 -16)"/>${leg(46,p+Math.PI,true)}${leg(-65,p,true)}<ellipse cx="6" cy="-17" rx="93" ry="53" fill="url(#fur)"/><path d="M-49 5Q-1 39 63 9Q43 47-12 35Z" fill="#f8cd87"/><g stroke="#bb6e2b" stroke-width="10" stroke-linecap="round" opacity=".7"><path d="M17-66l-5 21M42-61l-8 22M64-52l-8 18"/></g>${leg(59,p,false)}${leg(-56,p+Math.PI,false)}<g transform="translate(-82 ${n(-43+Math.sin(p)*1.2)})"><path d="M-45-31L-47-80Q-45-87-37-81L-9-55M18-50L46-79Q52-84 51-71L48-23" fill="#e5953e"/><path d="M-38-40L-39-68 -18-49M25-45L43-66 41-32" fill="#d78779"/><path d="M-58-13Q-62-51-29-59Q8-71 39-46Q57-28 54 2Q48 34 7 41Q-36 44-54 21L-66 16 -59 7 -68 1Z" fill="url(#face)"/><path d="M-25-56l3 16m15-20 1 17m16-16-2 17" stroke="#b96b2c" stroke-width="7" stroke-linecap="round"/><path d="M-52 0Q-37-13-21 2Q-6-13 9 4Q21 30-13 33Q-53 32-52 0Z" fill="#fce2af"/><ellipse cx="-40" cy="3" rx="10" ry="5" fill="#e9a47b" opacity=".5"/><ellipse cx="21" cy="5" rx="10" ry="5" fill="#e9a47b" opacity=".5"/>${blink?'<path d="M-41-13q8 7 15 0M7-13q8 7 15 0" fill="none" stroke="#41483a" stroke-width="4" stroke-linecap="round"/>':'<ellipse cx="-33" cy="-14" rx="6" ry="10" fill="#41483a"/><ellipse cx="14" cy="-14" rx="6" ry="10" fill="#41483a"/><circle cx="-35" cy="-17" r="2" fill="#fff5d6"/><circle cx="12" cy="-17" r="2" fill="#fff5d6"/>'}<path d="M-23 6Q-18 1-12 6L-18 12Z" fill="#9b615b"/><path d="M-18 12v6m0 0q-7 7-13 1m13-1q7 7 13 1" fill="none" stroke="#80523b" stroke-width="2.3" stroke-linecap="round"/><g stroke="#866e4d" stroke-width="1.7" stroke-linecap="round"><path d="M-43 12l-34-6m35 14-36 3M13 12l32-7M13 21l31 5"/></g></g></g></g>`;}
window.__duration=8;window.__ready=true;window.render=function(t){current=((Number(t)||0)%8+8)%8;const x=680-current*145;cats.innerHTML=cat(x,current)+cat(x+1160,current);slider.value=current;document.getElementById('readout').textContent=current.toFixed(1)+' / 8.0 s';};window.setPlaying=v=>{playing=!!v;last=null;button.textContent=playing?'إيقاف مؤقت':'تشغيل';button.setAttribute('aria-label',playing?'إيقاف الحركة':'تشغيل الحركة')};button.onclick=()=>window.setPlaying(!playing);slider.oninput=()=>{window.setPlaying(false);window.render(+slider.value)};if(new URLSearchParams(location.search).has('capture')){document.body.classList.add('capture');playing=false;}window.setPlaying(playing);window.render(0);function tick(ts){if(playing&&last!==null)window.render(current+(ts-last)/1000);last=ts;requestAnimationFrame(tick)}requestAnimationFrame(tick);})();
</script></body></html>
