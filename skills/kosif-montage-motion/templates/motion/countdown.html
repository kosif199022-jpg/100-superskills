<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>{{GO}} — KOSIF Motion</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<style>
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  html, body { margin: 0; padding: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{BG2}}; }
  #root { --u: calc(min({{W}}px, {{H}}px) / 100); position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden;
          background: radial-gradient(circle at 50% 45%, {{BG1}} 0%, {{BG2}} 75%); font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .rtl { direction: rtl; unicode-bidi: isolate; }
  #ring { position: absolute; left: 50%; top: 45%; width: calc(var(--u) * 58); height: calc(var(--u) * 58); transform: translate(-50%, -50%); }
  .n { position: absolute; left: 0; right: 0; top: 45%; transform: translateY(-50%); text-align: center; font-size: calc(var(--u) * 26); font-weight: 800; opacity: 0; direction: ltr; }
  #go { position: absolute; left: 5%; right: 5%; top: 45%; transform: translateY(-50%); text-align: center; font-size: calc(var(--u) * 15); font-weight: 800; color: {{ACCENT}}; visibility: hidden; }
  #flash { position: absolute; inset: 0; background: {{ACCENT}}; opacity: 0; pointer-events: none; z-index: 60; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{SECONDS}}" data-fps="{{FPS}}">
  <div id="cam">
    <svg id="ring" viewBox="0 0 100 100"><g id="arcs"></g></svg>
    <div id="nums"></div>
    <div id="go" class="rtl">{{GO}}</div>
    <div id="flash"></div>
  </div>
  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s);
    const W = {{W}}, H = {{H}}, D = {{SECONDS}};
    const root = $("#root"), cam = $("#cam");
    M.vignette(root, { strength: 0.4 });
    M.grain(root, { opacity: 0.05, seed: 2 });
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    const from = Math.max(1, Math.min(10, {{FROM}}));
    const nums = $("#nums"), arcs = $("#arcs");
    for (let k = 0; k < from; k++) {
      const v = from - k, at = k * 1.0;
      const el = document.createElement("div"); el.className = "n"; el.textContent = String(v); nums.appendChild(el);
      const arc = M.svgEl("path", { d: "M 50 4 A 46 46 0 1 1 49.99 4", stroke: "{{ACCENT}}", "stroke-width": "4", fill: "none", "stroke-linecap": "round", opacity: "0" }, arcs);
      // each second: the number slams in, settles with a squash, the ring runs down, then it leaves upward
      tl.fromTo(el, { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: M.ease.slam, immediateRender: false }, at);
      M.squash(tl, el, at + 0.32, { along: 0.08, across: 0.05, dur: 0.14 });
      M.drawPath(tl, arc, at + 0.05, 0.85, { ease: M.E.linear });
      tl.to(el, { opacity: 0, y: -40, scale: 0.9, duration: 0.16, ease: M.E.in }, at + 0.84);
      tl.to(arc, { opacity: 0, duration: 0.1 }, at + 0.9);
      M.shake(tl, cam, at, { amp: 5, seed: 20 + k });
    }
    M.flash(tl, $("#flash"), from, { peak: 0.6, dur: 0.45, again: true });
    M.revealWords(tl, $("#go"), from, { dur: 0.6, stagger: 0.08 });
    M.push(tl, cam, from, 1.0, 1.08, Math.max(0.8, D - from - 0.3), {});
    M.hideWords(tl, $("#go"), D - 0.35, { dur: 0.3 });
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", D);
  </script>
</div>
</body>
</html>
