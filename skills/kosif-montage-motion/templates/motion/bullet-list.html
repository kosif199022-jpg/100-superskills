<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}} — KOSIF Motion</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<style>
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-arabic-600-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  html, body { margin: 0; padding: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{BG2}}; }
  #root { --u: calc(min({{W}}px, {{H}}px) / 100); position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden;
          background: linear-gradient(180deg, {{BG1}} 0%, {{BG2}} 100%); font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .rtl { direction: rtl; unicode-bidi: isolate; }
  #title { position: absolute; left: 8%; right: 8%; top: 22%; text-align: right; font-size: calc(var(--u) * 7.5); font-weight: 800; visibility: hidden; }
  #rule { position: absolute; right: 8%; width: 18%; top: 31%; height: 5px; background: {{ACCENT}}; transform: scaleX(0); transform-origin: 100% 50%; }
  #list { position: absolute; left: 8%; right: 8%; top: 36%; }
  #list .line { display: flex; align-items: center; gap: calc(var(--u) * 2.4); margin: 0 0 calc(var(--u) * 2.6) 0; font-size: calc(var(--u) * 4.9); font-weight: 600; line-height: 1.4; opacity: 0; }
  #list .line svg { flex: 0 0 auto; width: calc(var(--u) * 5.5); height: calc(var(--u) * 5.5); }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{SECONDS}}" data-fps="{{FPS}}">
  <div id="cam">
    <div id="title" class="rtl">{{TITLE}}</div>
    <div id="rule"></div>
    <div id="list" class="rtl">{{ITEMS}}</div>
  </div>
  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s));
    const W = {{W}}, H = {{H}}, D = {{SECONDS}};
    const root = $("#root"), cam = $("#cam");
    M.vignette(root, { strength: 0.35 });
    M.grain(root, { opacity: 0.05, seed: 12 });
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    const lines = $$("#list .line");
    // every item gets a circle + a check mark the pen draws when the item has landed
    const checks = lines.map((ln) => {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("viewBox", "0 0 40 40");
      const c = M.svgEl("circle", { cx: 20, cy: 20, r: 17, stroke: "{{ACCENT}}", "stroke-width": 2.5, fill: "none", opacity: 0.5 }, svg);
      const p = M.svgEl("path", { d: "M 11 21 L 17 27 L 29 14", stroke: "{{ACCENT}}", "stroke-width": 3.5, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 }, svg);
      ln.insertBefore(svg, ln.firstChild);
      return p;
    });
    M.revealWords(tl, $("#title"), 0.3, { dur: 0.75, stagger: 0.08 });
    tl.fromTo($("#rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: M.E.out, immediateRender: false }, 0.8);
    const gap = Math.max(0.35, Math.min(0.7, (D - 3.2) / Math.max(1, lines.length)));
    lines.forEach((ln, i) => {
      const at = 1.1 + i * gap;
      tl.fromTo(ln, { x: 46, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: M.E.out, immediateRender: false }, at);
      M.drawPath(tl, checks[i], at + 0.22, 0.3, {});
    });
    M.push(tl, cam, 1.0, 1.0, 1.04, Math.max(1, D - 2.0), {});
    const exit = D - 0.8;
    tl.to(lines, { opacity: 0, x: -30, duration: 0.3, ease: M.E.in, stagger: 0.05 }, exit);
    tl.to($("#rule"), { scaleX: 0, duration: 0.3, ease: M.E.in }, exit);
    M.hideWords(tl, $("#title"), exit + 0.05, { dur: 0.4 });
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", D);
  </script>
</div>
</body>
</html>
