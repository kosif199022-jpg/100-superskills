<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}} — KOSIF Motion</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<style>
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-arabic-600-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  /* never dir="rtl" on <html>: direction lives on the text elements */
  html, body { margin: 0; padding: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{BG2}}; }
  #root { --u: calc(min({{W}}px, {{H}}px) / 100); position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden;
          background: linear-gradient(180deg, {{BG1}} 0%, {{BG2}} 100%); font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #scene { position: absolute; inset: 0; width: {{W}}px; height: {{H}}px; }
  .rtl { direction: rtl; unicode-bidi: isolate; }
  #title { position: absolute; left: 7%; right: 7%; top: 36%; text-align: center; font-size: calc(var(--u) * 9.5); font-weight: 800; line-height: 1.25; visibility: hidden; }
  #rule { position: absolute; left: 30%; width: 40%; top: 52.5%; height: 6px; }
  #sub { position: absolute; left: 10%; right: 10%; top: 55%; text-align: center; font-size: calc(var(--u) * 4.2); font-weight: 600; opacity: .9; visibility: hidden; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{SECONDS}}" data-fps="{{FPS}}">
  <div id="cam">
    <svg id="scene" viewBox="0 0 {{W}} {{H}}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="{{ACCENT}}" stop-opacity=".22"/><stop offset="1" stop-color="{{ACCENT}}" stop-opacity="0"/></radialGradient>
      </defs>
      <rect id="halo" x="0" y="0" width="{{W}}" height="{{H}}" fill="url(#glow)" opacity="0"/>
      <g id="particles"></g>
    </svg>
    <div id="title" class="rtl">{{TITLE}}</div>
    <svg id="rule" viewBox="0 0 100 6" preserveAspectRatio="none"><path id="ruleP" d="M 0 3 L 100 3" stroke="{{ACCENT}}" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
    <div id="sub" class="rtl">{{SUB}}</div>
    <div id="flash"></div>
  </div>
  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s);
    const W = {{W}}, H = {{H}}, D = {{SECONDS}};
    const root = $("#root"), cam = $("#cam");
    M.vignette(root, { strength: 0.38 });
    M.grain(root, { opacity: 0.05, seed: 3 });
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    // 0–1.2 s: the entrance (the title lands, the halo breathes up, a flash on the landing)
    tl.fromTo($("#halo"), { opacity: 0 }, { opacity: 1, duration: 1.4, ease: M.E.out }, 0.2);
    M.sparkle(tl, $("#particles"), { at: 0.1, n: 34, seed: 7, x0: W * 0.1, x1: W * 0.9, y0: H * 0.18, y1: H * 0.7, color: "{{ACCENT}}" });
    M.revealWords(tl, $("#title"), 0.3, { dur: 0.85, stagger: 0.09 });
    M.flash(tl, $("#flash"), 0.62, { peak: 0.5, dur: 0.4 });
    M.drawPath(tl, $("#ruleP"), 0.95, 0.55, {});
    M.riseWords(tl, $("#sub"), 1.25, { dur: 0.5, stagger: 0.07 });
    // the hold: one slow push, nothing else moves
    M.push(tl, cam, 1.3, 1.0, 1.06, Math.max(1.2, D - 2.3), {});
    // the exit: words leave upward, the rule and halo fade
    M.hideWords(tl, $("#sub"), D - 1.0, { dur: 0.4 });
    M.hideWords(tl, $("#title"), D - 0.9, { dur: 0.5 });
    tl.to([$("#rule"), $("#halo")], { opacity: 0, duration: 0.45, ease: M.E.in }, D - 0.8);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", D);
  </script>
</div>
</body>
</html>
