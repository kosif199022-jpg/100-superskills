<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>{{CTA}} — KOSIF Motion</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<style>
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-arabic-600-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  html, body { margin: 0; padding: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{BG2}}; }
  #root { --u: calc(min({{W}}px, {{H}}px) / 100); position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden;
          background: linear-gradient(180deg, {{BG1}} 0%, {{BG2}} 100%); font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .rtl { direction: rtl; unicode-bidi: isolate; }
  #cta { position: absolute; left: 8%; right: 8%; top: 34%; text-align: center; font-size: calc(var(--u) * 8.5); font-weight: 800; line-height: 1.3; visibility: hidden; }
  #handle { position: absolute; left: 8%; right: 8%; top: 47%; text-align: center; font-size: calc(var(--u) * 4.4); font-weight: 600; color: {{ACCENT}}; visibility: hidden; direction: ltr; }
  #icons { position: absolute; left: 0; right: 0; top: 56%; display: flex; justify-content: center; gap: calc(var(--u) * 5); }
  .ic { width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; opacity: 0; }
  .ic svg { width: 55%; height: 55%; }
  #btn { position: absolute; left: 50%; top: 70%; transform: translateX(-50%); padding: calc(var(--u) * 1.6) calc(var(--u) * 6); border-radius: 999px; background: {{ACCENT}};
         color: #111; font-size: calc(var(--u) * 4); font-weight: 800; opacity: 0; white-space: nowrap; }
  #bar { position: absolute; right: 0; bottom: 0; height: calc(var(--u) * 1); width: 100%; background: {{ACCENT}}; transform: scaleX(0); transform-origin: 100% 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{SECONDS}}" data-fps="{{FPS}}">
  <div id="cam">
    <div id="cta" class="rtl">{{CTA}}</div>
    <div id="handle">{{HANDLE}}</div>
    <div id="icons">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9z"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 12v8h16v-8M12 3v13M7 8l5-5 5 5"/></svg></div>
    </div>
    <div id="btn" class="rtl">اشترك</div>
    <div id="bar"></div>
  </div>
  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s));
    const W = {{W}}, H = {{H}}, D = {{SECONDS}};
    const root = $("#root"), cam = $("#cam");
    M.vignette(root, { strength: 0.35 });
    M.grain(root, { opacity: 0.05, seed: 8 });
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    M.revealWords(tl, $("#cta"), 0.3, { dur: 0.75, stagger: 0.08 });
    M.riseWords(tl, $("#handle"), 0.9, { dur: 0.45, stagger: 0.06 });
    const tEnd = M.stagger(tl, $$(".ic"), 1.25, { gap: 0.12, dur: 0.5, from: { y: 30, opacity: 0, scale: 0.8 } });
    tl.fromTo($("#btn"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: M.spring("snappy"), immediateRender: false }, tEnd);
    M.squash(tl, $("#btn"), tEnd + 1.1, { along: 0.1, across: 0.06, dur: 0.18 });
    M.squash(tl, $("#btn"), tEnd + 2.3, { along: 0.1, across: 0.06, dur: 0.18 });
    // the bar is a clock: it runs the whole card at constant speed (data ramp: linear by design)
    tl.fromTo($("#bar"), { scaleX: 0 }, { scaleX: 1, duration: Math.max(0.5, D - 0.4), ease: M.E.linear, immediateRender: false }, 0.2);
    M.breathe(tl, cam, 0.3, Math.max(0.8, D - 1.2), { creep: 0.015 });
    M.hideWords(tl, $("#cta"), D - 0.8, { dur: 0.4 });
    M.hideWords(tl, $("#handle"), D - 0.75, { dur: 0.35 });
    tl.to([...$$(".ic"), $("#btn")], { opacity: 0, y: 20, duration: 0.35, ease: M.E.in, stagger: 0.04 }, D - 0.7);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", D);
  </script>
</div>
</body>
</html>
