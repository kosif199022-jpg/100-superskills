<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>{{NAME}} — KOSIF Motion</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<style>
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-arabic-600-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 600; src: url("assets/fonts/cairo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  html, body { margin: 0; padding: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{BG2}}; }
  #root { --u: calc(min({{W}}px, {{H}}px) / 100); position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden;
          background: radial-gradient(circle at 50% 42%, {{BG1}} 0%, {{BG2}} 72%); font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #scene { position: absolute; inset: 0; width: {{W}}px; height: {{H}}px; }
  .rtl { direction: rtl; unicode-bidi: isolate; }
  #logo { position: absolute; left: 50%; top: 40%; width: calc(var(--u) * 34); height: calc(var(--u) * 38.5); transform: translate(-50%, -50%); }
  #name { position: absolute; left: 10%; right: 10%; top: 62%; text-align: center; font-size: calc(var(--u) * 8); font-weight: 800; letter-spacing: 0.06em; visibility: hidden; }
  #tag { position: absolute; left: 10%; right: 10%; top: 71%; text-align: center; font-size: calc(var(--u) * 3.6); font-weight: 600; opacity: .85; visibility: hidden; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{SECONDS}}" data-fps="{{FPS}}">
  <div id="cam">
    <svg id="scene" viewBox="0 0 {{W}} {{H}}" xmlns="http://www.w3.org/2000/svg"><g id="particles"></g></svg>
    <svg id="logo" viewBox="0 0 120 136">
      <path id="fill" d="{{PATH}}" fill="{{ACCENT}}" fill-rule="evenodd" opacity="0"/>
      <path id="mark" d="{{PATH}}" stroke="{{ACCENT}}" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0"/>
    </svg>
    <div id="name" class="rtl">{{NAME}}</div>
    <div id="tag" class="rtl">{{TAGLINE}}</div>
    <div id="flash"></div>
  </div>
  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s);
    const W = {{W}}, H = {{H}}, D = {{SECONDS}};
    const root = $("#root"), cam = $("#cam");
    M.vignette(root, { strength: 0.4 });
    M.grain(root, { opacity: 0.05, seed: 6 });
    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    // the pen draws the mark, the fill lands with a flash, then the name and the line
    M.drawPath(tl, $("#mark"), 0.25, 1.25, {});
    tl.fromTo($("#fill"), { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: M.spring("snappy"), immediateRender: false }, 1.5);
    M.flash(tl, $("#flash"), 1.5, { peak: 0.55, dur: 0.4 });
    M.sparkle(tl, $("#particles"), { at: 1.5, n: 30, seed: 13, x0: W * 0.2, x1: W * 0.8, y0: H * 0.2, y1: H * 0.6, color: "{{ACCENT}}" });
    M.revealWords(tl, $("#name"), 1.85, { dur: 0.7, stagger: 0.08 });
    M.riseWords(tl, $("#tag"), 2.3, { dur: 0.45, stagger: 0.07 });
    M.push(tl, cam, 1.5, 1.0, 1.05, Math.max(1, D - 2.6), {});
    M.hideWords(tl, $("#tag"), D - 0.95, { dur: 0.35 });
    M.hideWords(tl, $("#name"), D - 0.85, { dur: 0.45 });
    tl.to($("#logo"), { opacity: 0, scale: 1.06, duration: 0.45, ease: M.E.in }, D - 0.7);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
    M.shim("root", D);
  </script>
</div>
</body>
</html>
