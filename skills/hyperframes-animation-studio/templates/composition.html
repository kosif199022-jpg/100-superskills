<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}} — KOSIF Motion</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion-kit.js"></script>
<style>
  /* never put dir="rtl" on <html> (HyperFrames renders that blank): scope direction to text elements */
  html, body { margin: 0; padding: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #0d1b2a; }
  #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #0d1b2a;
          font-family: "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #title { direction: rtl; unicode-bidi: isolate; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  #scene { position: absolute; inset: 0; width: {{W}}px; height: {{H}}px; }
  #title { position: absolute; right: 0; left: 0; top: 40%; text-align: center; font-size: 110px; font-weight: 800; visibility: hidden;
           text-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; }
</style>
</head>
<body>
<!-- HyperFrames composition: data-* on the root is the contract; GSAP timelines are registered on window.__timelines.
     Rules of the house (motion-director): a scene list first; one carrier object through the film; every entrance moves
     position + scale + blur together from ≥ 0.35 of the stage width away; 2–3 named camera moves and stillness between;
     ≤ 8 words on screen; four easings only (MOTION.ease.slam / snap / drive / settle); no wall clock, no Math.random. -->
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{SECONDS}}" data-fps="{{FPS}}">
  <!-- <audio id="ambience" src="assets/ambience.wav" data-start="0" data-duration="{{SECONDS}}" data-volume="0.9"></audio> -->
  <div id="cam">
    <svg id="scene" viewBox="0 0 {{W}} {{H}}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop id="bg0" offset="0" stop-color="#1b2a49"/><stop id="bg1" offset="1" stop-color="#0d1b2a"/></linearGradient>
      </defs>
      <rect x="0" y="0" width="{{W}}" height="{{H}}" fill="url(#bg)"/>
      <g id="particles"></g>
    </svg>
    <div id="title">{{TITLE}}</div>
    <div id="flash"></div>
  </div>

  <script>
    const M = window.MOTION, $ = (s) => document.querySelector(s);
    const root = $("#root"), cam = $("#cam");
    M.vignette(root, { strength: 0.4 });
    M.grain(root, { opacity: 0.06, seed: 2 });

    const tl = gsap.timeline({ paused: true, defaults: { ease: M.ease.drive } });
    // ── scene 1: the title arrives (replace with your scene list) ──
    M.revealWords(tl, $("#title"), 0.4, { dur: 0.9, stagger: 0.08 });
    M.sparkle(tl, $("#particles"), { at: 0, n: 40, seed: 3, x0: 0, x1: {{W}}, y0: 0, y1: {{H}} * 0.6 });
    M.camera(tl, cam, 1.2, { scale: 1.06, dur: 2.0 });
    M.hideWords(tl, $("#title"), {{SECONDS}} - 1.0, { dur: 0.5 });

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;                       // HyperFrames discovers the timeline here
    M.shim("root", {{SECONDS}});                            // KOSIF Studio's renderer: window.render(t)
  </script>
</div>
</body>
</html>
